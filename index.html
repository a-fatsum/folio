<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Folio</title>
  </head>
  <body>
    <nav id="nav_bar" class="flex justify-between items-center px-12 py-12">
      <a href="#" class="text-2xl font-bold text-gray-800"> Mustapha.dev </a>
      <!-- Navigation Links -->
      <div class="flex space-x-6 font-bold text-lg">
        <a href="#" class="">Home</a>
        <a href="#" class="">About</a>
        <a href="#" class="">Projects</a>
        <a href="#" class="">Contact</a>
      </div>
    </nav>

    <main class="wrapper">
      <!-- Weather Widget-->
      <div
        id="weather-widget"
        class="fixed bottom-0 left-0 flex-col gap-5 m-4"
      ></div>

      <section id="hero_section" class="relative">
        <!-- Hero Section -->
        <div
          class="hero_container flex flex-col md:flex-row items-center justify-between max-w-6xl mx-auto px-6 py-16 rounded-lg"
        >
          <!-- Text Content -->
          <div class="hero_text text-center md:text-left max-w-2xl">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 text-gray-900">
              Hi, I'm Mustapha.
            </h1>
            <p class="text-xl md:text-2xl text-gray-800 mt-2">
              Front-end developer, from Melbourne, Australia 🦘.
            </p>

            <!-- Social Icons -->
            <div
              class="social_icons mt-6 flex justify-center md:justify-start items-center gap-4"
            >
              <img
                src="images/svgIcons/linkedin.svg"
                alt="LinkedIn profile"
                class="w-6 h-6 hover:scale-110 transition-transform"
              />
              <img
                src="images/svgIcons/github.svg"
                alt="GitHub profile"
                class="w-6 h-6 hover:scale-110 transition-transform"
              />
            </div>

            <!-- Tech Stack -->
            <div
              class="tech_stack mt-10 flex items-center flex-wrap gap-4 justify-center md:justify-start"
            >
              <div class="text-base font-medium whitespace-nowrap">
                Tech Stack |
              </div>
              <div class="flex flex-wrap gap-4">
                <img
                  src="images/svgIcons/html-5-svgrepo-com.svg"
                  alt="HTML5"
                  class="w-8 h-8"
                />
                <img
                  src="images/svgIcons/css-3-svgrepo-com.svg"
                  alt="CSS3"
                  class="w-8 h-8"
                />
                <img
                  src="images/svgIcons/js-svgrepo-com.svg"
                  alt="JavaScript"
                  class="w-8 h-8"
                />
                <img
                  src="images/svgIcons/tailwind-svgrepo-com.svg"
                  alt="Tailwind CSS"
                  class="w-8 h-8"
                />
                <img
                  src="images/svgIcons/bootstrap-svgrepo-com.svg"
                  alt="Bootstrap"
                  class="w-8 h-8"
                />
                <img
                  src="images/svgIcons/react-svgrepo-com.svg"
                  alt="React"
                  class="w-8 h-8"
                />
                <img
                  src="images/svgIcons/svelte-icon-svgrepo-com.svg"
                  alt="Svelte"
                  class="w-8 h-8"
                />
              </div>
            </div>
          </div>

          <!-- Hero Image Placeholder -->
          <div
            id="hero_image_container"
            class="mt-10 md:mt-0 md:ml-12 w-full md:w-1/2 h-64 bg-gray-200 rounded-lg"
          >
            <!-- Add hero image here -->
          </div>
        </div>
      </section>
    </main>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
  </body>
</html>
